# Retention CronJobs — bound the append-forever / accumulating derived tables so
# a long-running instance doesn't grow the database and PDF store without limit.
#
#   iceberg-prune-audit   — deletes AuditEvent rows and un-ingested FeedItem rows
#                           past ICEBERG_AUDIT_RETENTION_DAYS /
#                           ICEBERG_FEED_ITEM_RETENTION_DAYS (0 = keep forever).
#   iceberg-prune-renders — deletes rendered PDFs past the render retention policy
#                           (ICEBERG_RENDER_RETENTION_KEEP / _DAYS).
#
# Both are one bounded pass per run (made for a CronJob), reuse the same image,
# ConfigMap and Secret as the app, and share migrate-job.yaml's hardened pod
# security context. Adjust the schedules to taste.
#
# Two scheduling hazards these manifests are shaped to avoid (#279). With
# `concurrencyPolicy: Forbid`, a single job that never finishes suppresses every
# later run — retention then stops silently, which is exactly the unbounded
# growth it exists to prevent. So:
#
#   * `activeDeadlineSeconds` caps a run, letting a wedged job fail and the next
#     one start, and `backoffLimit` bounds retries within a run.
#   * `resources.requests` are set on both: a namespace with a ResourceQuota
#     rejects pods that omit requests, which is another silent-stop path.
#   * The audit prune no longer mounts `iceberg-data`. That PVC is ReadWriteOnce
#     and permanently attached to the running app pod, so on a multi-node
#     cluster a cron pod scheduled elsewhere hangs in ContainerCreating on volume
#     attach. The audit/feed-item prune is DB-only, so it simply doesn't need it.
#     `prune-renders` genuinely does (it deletes PDF files), so it is pinned to
#     the app's node instead — see its affinity block.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iceberg-prune-audit
spec:
  # 03:30 daily — off-peak; retention windows are in days, so daily is ample.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A wedged run must not suppress the schedule forever (Forbid, above).
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune-audit
              # Pin to the same immutable tag/digest as the Deployment.
              image: ghcr.io/icebergai/icebergcti:latest
              command: ["iceberg-prune-audit"]
              envFrom:
                - configMapRef:
                    name: iceberg-config
                - secretRef:
                    name: iceberg-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
              volumeMounts:
                # DB-only work — no /data mount, so this job never contends for
                # the app's RWO PVC. /tmp is scratch for a read-only root.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iceberg-prune-renders
spec:
  # 03:45 daily — staggered after the audit prune.
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # This job deletes rendered PDFs, so it must mount the same
          # `iceberg-data` PVC as the app. That claim is ReadWriteOnce (pvc.yaml)
          # and already attached to the running app pod, so the cron pod has to
          # land on the SAME node or it will hang in ContainerCreating on attach.
          # Co-locate it with the app pod. If you move to a ReadWriteMany storage
          # class (or run single-node), this block is unnecessary — drop it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: iceberg
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune-renders
              image: ghcr.io/icebergai/icebergcti:latest
              command: ["iceberg-prune-renders"]
              envFrom:
                - configMapRef:
                    name: iceberg-config
                - secretRef:
                    name: iceberg-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: iceberg-data
            - name: tmp
              emptyDir: {}
