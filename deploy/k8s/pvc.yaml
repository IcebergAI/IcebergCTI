apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iceberg-data
# Legacy local-storage source only. New S3-backed installations do not apply or mount this PVC;
# storage-migrate-job.yaml mounts it read-only during a controlled migration.
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
