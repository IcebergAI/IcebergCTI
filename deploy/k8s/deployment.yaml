apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: iceberg
  template:
    metadata:
      labels:
        app: iceberg
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: iceberg
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iceberg
          # Pin to an immutable tag/digest in production (not :latest), e.g.
          # ghcr.io/icebergai/icebergcti:0.1.0@sha256:<digest>.
          image: ghcr.io/icebergai/icebergcti:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: iceberg-config
            - secretRef:
                name: iceberg-secrets
          env:
            # Writable cache for the Typst package fetch (cmarker), since the
            # root filesystem is read-only.
            - name: XDG_CACHE_HOME
              value: /cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        # Read-only root filesystem ⇒ scratch space for tempfile + Typst renders
        # and the Typst package cache come from emptyDir mounts.
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
