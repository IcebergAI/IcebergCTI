name: Release

# Cut a signed, attested release from a SemVer git tag: an immutable GHCR image
# with an SBOM, SLSA build provenance, and a keyless cosign signature, plus a
# GitHub Release. This is the only source of deployable release images. Actions
# are SHA-pinned like ci.yml / codeql.yml.
#
# Trigger: push a tag like `v0.1.0` (SemVer spelling — see docs/RELEASING.md).
# workflow_dispatch runs a build-only dry run (no push / sign / attest / release).
#
# Split into two jobs for least privilege (#254): `build` validates the tag and
# builds the image with `contents: read` only, and `publish` — which holds the
# write/OIDC scopes — is gated on it and on an actual tag push. So the dry-run
# path never executes with elevated or OIDC scope, and on a real release the
# validation (tag-vs-pyproject, commit-is-on-main) has already passed in a
# low-privilege context before any credential-bearing job starts. `publish`
# rebuilds rather than importing an artifact, because provenance and SBOM must be
# attached by the pushing build; the GHA layer cache makes that near-free.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# Two v* tags pushed close together must not race to publish `:latest` out of
# order. Serialise per ref, and never cancel — a half-published release (image
# pushed, signature/attestation missing) is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap the job (like ci.yml) so a wedged step can't burn the 6h default.
    timeout-minutes: 30
    permissions:
      contents: read # validation + build only; no push, sign, attest or release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fail the release if the tag disagrees with the pyproject version, so a tag
      # can never ship an image labelled a different version. PEP 440 (pyproject)
      # and SemVer (tag) spell pre-releases differently — see docs/RELEASING.md — so
      # normalize before comparing. Reads only $GITHUB_* env + git, no ${{ }} into
      # the shell, so zizmor template-injection cannot apply.
      - name: Verify tag matches pyproject version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Only four PEP 440 forms are supported (see the docs/RELEASING.md
          # table): final, aN, bN, rcN. Everything else valid under PEP 440 —
          # dev releases (.devN), post releases (.postN), an epoch (N!...), a
          # local version (+local), or a zero-padded pre-release (b01) — would
          # fall through the sed below UNNORMALISED. A genuine mismatch still
          # fails closed downstream, but a hand-crafted tag matching the
          # un-normalised string could mint a malformed OCI tag. Reject them
          # here with an actionable error instead of relying on that (#253).
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*((a|b|rc)[1-9][0-9]*)?$'; then
            echo "::error::pyproject version '${VERSION}' uses a PEP 440 form this release workflow does not support. Supported: X.Y.Z, X.Y.ZaN, X.Y.ZbN, X.Y.ZrcN (N without leading zeros). Not supported: .devN, .postN, epochs (N!), local versions (+local), zero-padded pre-releases."
            exit 1
          fi
          # PEP 440 -> SemVer: 0.1.0b1 -> 0.1.0-beta.1, 0.1.0rc1 -> 0.1.0-rc.1,
          # 0.1.0a1 -> 0.1.0-alpha.1; a final release is unchanged.
          SEMVER=$(printf '%s' "$VERSION" | sed -E 's/a([0-9]+)$/-alpha.\1/; s/b([0-9]+)$/-beta.\1/; s/rc([0-9]+)$/-rc.\1/')
          EXPECTED="v${SEMVER}"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag ${REF_NAME} does not match pyproject version ${VERSION} (expected ${EXPECTED})"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Version v${VERSION} (expected tag ${EXPECTED}); ref ${REF_TYPE}/${REF_NAME}"

      # Refuse to release a commit that isn't on main: a v* tag pushed on an
      # unmerged/unreviewed branch (same pyproject version) would otherwise publish
      # the sole deployable image, bypassing main's review + CI. Ask the API whether
      # main contains this commit (identical = tip, behind = main is ahead of it,
      # i.e. merged); ahead/diverged means it isn't on main.
      - name: Verify tagged commit is on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq '.status')
          case "$status" in
            identical | behind)
              echo "Tagged commit ${SHA} is on main (compare status: ${status})." ;;
            *)
              echo "::error::Tagged commit ${SHA} is not on main (compare status: ${status}); refusing to release an unmerged commit."
              exit 1 ;;
          esac

      # The SBOM + provenance attestations below require the docker-container buildx
      # driver; the runner's default `docker` driver rejects them and fails the build.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # A plain build, never pushed — this job holds no packages scope to push
      # with. Its job is to prove the image builds before `publish` is allowed to
      # start, and to be the whole of the workflow_dispatch dry run. Layers are
      # written to the GHA cache so the publishing build reuses them.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    # Only a real tag push publishes. Gated on `build`, so the elevated scopes
    # below are never granted to a job until validation and the build have passed
    # in the low-privilege job above (#254).
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Cap the job (like ci.yml) so a wedged step can't burn the 6h default and
    # leave a half-published release (image pushed, no signature/release) hanging.
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
      packages: write # push image to GHCR
      id-token: write # cosign keyless signing + provenance OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `build` already validated the tag; this only re-exports IMAGE for the
      # steps below (env doesn't cross job boundaries).
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SemVer tags from the git tag. {{major}}.{{minor}} and latest are only emitted
      # for a stable (non-pre-release) tag, so a beta never claims :0.1 or :latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Rebuilt here rather than imported from `build`: the SBOM and provenance
      # attestations must be produced by the build that pushes. The GHA cache
      # populated by `build` makes this near-free.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # gh (preinstalled on the runner) rather than a release action — one less
      # third-party action to trust (zizmor superfluous-actions). Pre-release tags
      # (those with a SemVer `-suffix`) are marked --prerelease.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # docker/metadata-action normalises a SemVer git tag such as v0.1.0-beta.1
          # to the published OCI tag 0.1.0-beta.1 (no leading `v`).
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          notes_file="$(mktemp)"
          {
            echo "Container image published to GHCR — SBOM + SLSA provenance attested, cosign-signed:"
            echo ""
            echo "    ${IMAGE}:${IMAGE_TAG}"
            echo ""
            echo "Pull, verify (cosign / attestation), and deploy instructions: docs/RELEASING.md."
          } > "$notes_file"
          flags=(--title "$TAG" --generate-notes --notes-file "$notes_file")
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}"
